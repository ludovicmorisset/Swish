services:
  swish:
    build:
      context: .
    image: swish:latest
    container_name: swish
    init: true
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - swish-data:/data
    environment:
      DATA_DIR: /data
      PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  swish-data:
