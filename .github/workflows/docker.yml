name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check src/domain.mjs && node --check src/demo.mjs && node --check server.mjs && node --check sw.js && node -e 'const fs=require("node:fs"),vm=require("node:vm");for(const file of ["index.html","public.html"]){const html=fs.readFileSync(file,"utf8");for(const match of html.matchAll(/<script type="module">([\\s\\S]*?)<\\/script>/g))new vm.Script("(async()=>{"+match[1].split("\\n").filter(line=>!line.trimStart().startsWith("import ")).join("\\n")+"})");}'
      - name: Run tests
        run: npm test
      - name: Build image
        run: docker build --tag swish:test .
      - name: Smoke test container
        run: |
          docker network create npm_default
          trap 'docker compose -f docker-compose.yml down >/dev/null 2>&1 || true; docker network rm npm_default >/dev/null 2>&1 || true' EXIT
          docker compose -f docker-compose.yml up --detach --build
          container=$(docker compose -f docker-compose.yml ps -q swish)
          for attempt in $(seq 1 20); do
            if docker exec "$container" node -e 'fetch("http://127.0.0.1:8080/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              break
            fi
            sleep 1
          done
          docker exec "$container" wget -q -O - http://127.0.0.1:8080/ | grep -q '<title>Swish'
          docker exec "$container" wget -q -O - http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          docker exec "$container" wget -q -O - http://127.0.0.1:8080/manifest.webmanifest | grep -q '"name"'
